# Production stack: Next.js + API behind the host's Nginx (see deploy/nginx/nexus.conf).
# The API is built from the backend repo (Kplgithub/Nexus_Backend), checked out at ./backend
# next to this repo's files (deploy.sh keeps it on the right commit).
# Database: MongoDB Atlas, or the bundled `mongo` service when USE_LOCAL_MONGO=true in
# .env.production (deploy.sh then adds `--profile localdb`; server-setup.sh configures it).
#
#   cd /srv/nexus && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build

name: nexus

services:
  api:
    build:
      context: ../backend
      dockerfile: apps/api/Dockerfile
    image: nexus-api:${RELEASE:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
    ports:
      - '127.0.0.1:4000:4000' # only reachable through Nginx
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    depends_on:
      mongo:
        condition: service_healthy
        required: false # only when the localdb profile is active

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_NOINDEX: ${NEXT_PUBLIC_NOINDEX:-false}
    image: nexus-web:${RELEASE:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECONDS: ${REVALIDATE_SECONDS:-60}
      IMAGE_HOSTS: ${IMAGE_HOSTS:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  mongo:
    # Pinned: MongoDB 8 refuses to start on Linux kernel 6.19+ (SERVER-121912).
    image: mongo:7.0
    profiles: [localdb]
    restart: unless-stopped
    command: ['--auth', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.5']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nexus}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes: ['mongo-data:/data/db']
    # No published ports: reachable only from the api container.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  mongo-data:
