name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Lint, typecheck, unit & API tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # only used to commit a generated pnpm-lock.yaml on the first run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            scripts/ci-run.sh "Install" pnpm install --frozen-lockfile
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            scripts/ci-run.sh "Install" pnpm install --no-frozen-lockfile
          fi
      - name: Commit generated lockfile (first run on main only)
        if: ${{ steps.install.outputs.generated == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm-lock.yaml generated by CI"
          git push
      - name: Build shared package
        run: scripts/ci-run.sh "Build shared" pnpm --filter @nexus/shared build
      - name: Format check
        run: scripts/ci-run.sh "Format check" pnpm format:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Lint" pnpm -r lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Typecheck" pnpm -r typecheck
      - name: Unit and API tests (in-memory MongoDB)
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Tests" pnpm -r test
      - name: Production build
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: scripts/ci-run.sh "Build" bash -c "pnpm --filter @nexus/api build && pnpm --filter @nexus/web build"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nexus_e2e
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      UPLOAD_DRIVER: local
      LOCAL_UPLOAD_PUBLIC_URL: http://localhost:4000/uploads
      REVALIDATE_SECONDS: '5'
      PUBLIC_CACHE_SECONDS: '0'
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: Ci-Only-Password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Build
        run: scripts/ci-run.sh "E2E build" bash -c "pnpm --filter @nexus/shared build && pnpm --filter @nexus/api build && pnpm --filter @nexus/web build"
      - name: Seed database
        run: |
          scripts/ci-run.sh "Seed base" pnpm --filter @nexus/api seed:base
          ADMIN_EMAIL=$E2E_ADMIN_EMAIL ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD ADMIN_NAME="CI Admin" scripts/ci-run.sh "Seed admin" pnpm --filter @nexus/api seed:admin
      - name: Start API and web
        run: |
          (cd apps/api && NODE_ENV=development node dist/server.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          npx --yes wait-on -t 90000 http://localhost:4000/api/v1/health http://localhost:3000/robots.txt || { scripts/ci-run.sh "Server start" bash -c "tail -n 60 api.log web.log; exit 1"; }
      - run: pnpm --filter @nexus/web exec playwright install --with-deps chromium
      - name: Playwright
        run: scripts/ci-run.sh "E2E" pnpm --filter @nexus/web test:e2e
      - if: failure()
        run: scripts/ci-run.sh "Server logs" bash -c "tail -n 60 api.log web.log; exit 1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
