name: Check out the backend
description: >
  Checks out Kplgithub/Nexus_Backend into ./backend (gitignored) using the BACKEND_REPO_TOKEN
  secret, and optionally installs and builds it.
inputs:
  token:
    description: secrets.BACKEND_REPO_TOKEN (fine-grained token, Contents read-only on Nexus_Backend)
    required: true
  ref:
    description: Backend branch, tag or SHA
    default: main
  build:
    description: Install dependencies and build the API
    default: 'false'
runs:
  using: composite
  steps:
    - name: Check the access token
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error title=Backend access missing::Add the BACKEND_REPO_TOKEN secret (Settings → Secrets and variables → Actions): a fine-grained GitHub token with read-only Contents access to Kplgithub/Nexus_Backend. See docs/DEPLOYMENT.md."
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        repository: Kplgithub/Nexus_Backend
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: backend
        persist-credentials: false
    - name: Install and build the API
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: backend
      run: |
        pnpm install --frozen-lockfile
        pnpm build
