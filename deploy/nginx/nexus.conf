# /etc/nginx/sites-available/nexus.conf  →  ln -s to sites-enabled, then `nginx -t && systemctl reload nginx`
# Replace example.com with the real domain. Certificates are issued by Certbot (see docs/DEPLOYMENT.md).

limit_req_zone $binary_remote_addr zone=nexus_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nexus_forms:10m rate=10r/m;

upstream nexus_web { server 127.0.0.1:3000; keepalive 32; }
upstream nexus_api { server 127.0.0.1:4000; keepalive 32; }

# HTTP → HTTPS (and ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;   # up to 10 images × 8 MB per upload request
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/nexus.access.log;
    error_log  /var/log/nginx/nexus.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Lead forms and sign-in endpoints: tighter limit on top of the API's own limiters.
    location ~ ^/api/v1/(enquiries|auth/(login|signup|otp/request|otp/login|forgot-password|reset-password))$ {
        limit_req zone=nexus_forms burst=5 nodelay;
        proxy_pass http://nexus_api;
    }

    location /api/ {
        limit_req zone=nexus_api burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://nexus_api;
    }

    # Next.js static assets are content-hashed: cache for a year.
    location /_next/static/ {
        proxy_pass http://nexus_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nexus_web;
    }
}
