name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Lint, typecheck, unit & API tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # only used to commit a generated pnpm-lock.yaml on the first run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            scripts/ci-run.sh "Install" pnpm install --frozen-lockfile
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            scripts/ci-run.sh "Install" pnpm install --no-frozen-lockfile
          fi
      - name: Commit generated lockfile (first run on main only)
        if: ${{ steps.install.outputs.generated == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm-lock.yaml generated by CI"
          git push
      - name: Build shared package
        run: scripts/ci-run.sh "Build shared" pnpm --filter @nexus/shared build
      - name: Format check
        run: scripts/ci-run.sh "Format check" pnpm format:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Lint" pnpm -r --no-bail lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Typecheck" pnpm -r --no-bail typecheck
      - name: Unit and API tests (in-memory MongoDB)
        if: ${{ !cancelled() }}
        run: scripts/ci-run.sh "Tests" pnpm -r --no-bail test
      - name: Production build
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: scripts/ci-run.sh "Build" bash -c "pnpm --filter @nexus/api build && pnpm --filter @nexus/web build"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nexus_e2e
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      UPLOAD_DRIVER: local
      SMS_DRIVER: console
      LOCAL_UPLOAD_PUBLIC_URL: /uploads
      REVALIDATE_SECONDS: '5'
      PUBLIC_CACHE_SECONDS: '0'
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: Ci-Only-Password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          for i in $(seq 1 45); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          scripts/ci-run.sh "MongoDB start" bash -c "docker ps -a; docker logs --tail 60 mongo; exit 1"
      - name: Build
        run: scripts/ci-run.sh "E2E build" bash -c "pnpm --filter @nexus/shared build && pnpm --filter @nexus/api build && pnpm --filter @nexus/web build"
      - name: Seed database
        timeout-minutes: 5
        run: |
          scripts/ci-run.sh "Seed base" pnpm --filter @nexus/api seed:base
          scripts/ci-run.sh "Seed locations" pnpm --filter @nexus/api seed:locations
          ADMIN_EMAIL=$E2E_ADMIN_EMAIL ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD ADMIN_NAME="CI Admin" scripts/ci-run.sh "Seed admin" pnpm --filter @nexus/api seed:admin
      - name: Start API and web
        timeout-minutes: 5
        run: |
          (cd apps/api && NODE_ENV=development node dist/server.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          npx --yes wait-on -t 90000 http://localhost:4000/api/v1/health http://localhost:3000/robots.txt || { scripts/ci-run.sh "Server start" bash -c "tail -n 60 api.log web.log; exit 1"; }
      - run: pnpm --filter @nexus/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @nexus/web test:e2e
      - if: failure()
        run: node scripts/playwright-summary.mjs apps/web/e2e-results.json
      - if: failure()
        run: scripts/ci-run.sh "Server logs" bash -c "tail -n 60 api.log web.log; exit 1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  production-stack:
    name: Production Docker stack (bundled MongoDB)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway production env file
        run: |
          umask 077
          cat > deploy/.env.production <<'ENV'
          RELEASE=ci
          NEXT_PUBLIC_SITE_URL=https://nexus.example.com
          NEXT_PUBLIC_NOINDEX=true
          USE_LOCAL_MONGO=true
          MONGO_ROOT_USER=nexus
          MONGO_ROOT_PASSWORD=ci-only-db-password
          MONGODB_URI=mongodb://nexus:ci-only-db-password@mongo:27017/nexus?authSource=admin
          CORS_ORIGINS=https://nexus.example.com
          PUBLIC_SITE_URL=https://nexus.example.com
          JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret
          COOKIE_SECURE=true
          SMS_DRIVER=disabled
          UPLOAD_DRIVER=cloudinary
          CLOUDINARY_CLOUD_NAME=ci
          CLOUDINARY_API_KEY=ci
          CLOUDINARY_API_SECRET=ci
          ENABLE_API_DOCS=false
          ENV
          sed -i 's/^ *//' deploy/.env.production
      - name: Build and start (same commands as the server)
        run: |
          git config user.email ci@example.com && git config user.name ci
          scripts/ci-run.sh "Production build" bash -c "./deploy/scripts/nexus.sh build 2>&1 | tail -n 80; exit \${PIPESTATUS[0]}"
          ./deploy/scripts/nexus.sh up -d || scripts/ci-run.sh "Production up" bash -c "./deploy/scripts/nexus.sh ps -a; ./deploy/scripts/nexus.sh logs --tail=60 api mongo; exit 1"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/v1/health | grep -q '"db":"up"' && curl -fsS -o /dev/null http://127.0.0.1:3000/robots.txt && exit 0
            sleep 3
          done
          scripts/ci-run.sh "Production start" bash -c "./deploy/scripts/nexus.sh ps; ./deploy/scripts/nexus.sh logs --tail=80; exit 1"
      - name: Seed and smoke-test
        run: |
          ./deploy/scripts/nexus.sh seed-base
          ./deploy/scripts/nexus.sh seed-locations
          ./deploy/scripts/nexus.sh sync-indexes
          curl -fsS http://127.0.0.1:4000/api/v1/locations | grep -q '"slug":"jaipur"'
          curl -fsS http://127.0.0.1:3000/ | grep -q 'NEXUS'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/properties/does-not-exist); test "$code" = 404
          curl -fsS http://127.0.0.1:3000/api/v1/auth/config
      - name: Backup script works against the bundled database
        run: |
          ./deploy/scripts/backup-mongo.sh
          ls -l deploy/backups && test -s "$(ls deploy/backups/nexus-*.archive.gz | head -n1)"
      - if: failure()
        run: ./deploy/scripts/nexus.sh logs --tail=120
