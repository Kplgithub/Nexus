name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: two overlapping `next build` runs on the server fail
# ("Another next build process is already running").
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Server via SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "
            export PATH=\$PATH:/usr/bin:/usr/local/bin
            set -euo pipefail
            cd '$DEPLOY_PATH'
            echo 'Fetching latest code...'
            git fetch origin main
            git reset --hard origin/main

            echo 'Installing dependencies...'
            pnpm install

            echo 'Building frontend...'
            pnpm build

            echo 'Restarting nexus-web process...'
            pm2 restart nexus-web

            echo 'Waiting for service to be healthy...'
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:3000
            echo 'Deployment successful!'
          "
