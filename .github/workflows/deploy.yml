name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: two overlapping `next build` runs on the server fail
# ("Another next build process is already running").
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts/web-release.sh
          sparse-checkout-cone-mode: false

      # Builds the new version in its own folder while the live site keeps
      # running, tests it on a spare port, then swaps with `pm2 reload` (no
      # downtime). On any failure the old version stays live or is put back.
      # Details: deploy/scripts/web-release.sh and docs/DEPLOYMENT.md.
      - name: Deploy to Server via SSH (zero downtime)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Copy the script up first (a script piped into `bash -s` can be eaten by
          # commands inside it that read stdin, e.g. pnpm).
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'cat > /tmp/nexus-web-release.sh' < deploy/scripts/web-release.sh
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "export PATH=\$PATH:/usr/bin:/usr/local/bin; DEPLOY_PATH='$DEPLOY_PATH' bash /tmp/nexus-web-release.sh < /dev/null"
